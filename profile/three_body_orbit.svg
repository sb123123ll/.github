<svg width="840" height="340" viewBox="0 0 840 340" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 背景极简科技网格 -->
    <pattern id="orbit-grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#00f7ff" stroke-width="0.3" stroke-opacity="0.08"/>
    </pattern>

    <!-- 三体光芒滤镜与渐变 -->
    <radialGradient id="sun-alpha" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f7ff" stop-opacity="1"/>
      <stop offset="40%" stop-color="#00f7ff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#00f7ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sun-beta" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff007f" stop-opacity="1"/>
      <stop offset="40%" stop-color="#ff007f" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ff007f" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sun-gamma" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00ff88" stop-opacity="1"/>
      <stop offset="40%" stop-color="#00ff88" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#00ff88" stop-opacity="0"/>
    </radialGradient>

    <!-- 8字形经典Poincaré周期轨道路径 (Figure-8 Orbit) -->
    <path id="orbit-path-alpha" d="M 420 170 C 490 80, 600 110, 560 170 C 520 230, 420 170, 420 170 C 420 170, 320 110, 280 170 C 240 230, 350 260, 420 170 Z" />
    <path id="orbit-path-beta" d="M 560 170 C 520 230, 420 170, 420 170 C 420 170, 320 110, 280 170 C 240 230, 350 260, 420 170 C 490 80, 600 110, 560 170 Z" />
    <path id="orbit-path-gamma" d="M 280 170 C 240 230, 350 260, 420 170 C 490 80, 600 110, 560 170 C 520 230, 420 170, 420 170 C 420 170, 320 110, 280 170 Z" />
  </defs>

  <!-- 舱底基板与极简框体 -->
  <rect width="840" height="340" rx="8" fill="#080c14" stroke="#00f7ff" stroke-width="1.2" stroke-opacity="0.6"/>
  <rect width="840" height="340" rx="8" fill="url(#orbit-grid)"/>

  <!-- 四角机甲坐标标记与刻度 -->
  <path d="M 3 20 L 3 3 L 20 3" fill="none" stroke="#00f7ff" stroke-width="2"/>
  <path d="M 837 20 L 837 3 L 820 3" fill="none" stroke="#00f7ff" stroke-width="2"/>
  <path d="M 3 320 L 3 337 L 20 337" fill="none" stroke="#00f7ff" stroke-width="2"/>
  <path d="M 837 320 L 837 337 L 820 337" fill="none" stroke="#00f7ff" stroke-width="2"/>

  <!-- 顶部状态栏信息 -->
  <text x="24" y="28" fill="#00f7ff" font-family="'Fira Code', 'Microsoft YaHei', monospace" font-size="12.5" font-weight="bold">◈ THREE-BODY CHAOS ORBIT ENGINE // 实时引力动力学模拟器</text>
  <text x="815" y="28" fill="#00ff88" font-family="'Fira Code', monospace" font-size="11" text-anchor="end">STATUS: UNSTABLE_CHAOS [dt=0.001]</text>
  <line x1="20" y1="38" x2="820" y2="38" stroke="#00f7ff" stroke-width="0.5" stroke-opacity="0.25"/>

  <!-- 几何半简约同心引力场与坐标原点 -->
  <circle cx="420" cy="170" r="130" fill="none" stroke="#30363d" stroke-width="0.8" stroke-dasharray="3 6"/>
  <circle cx="420" cy="170" r="80" fill="none" stroke="#30363d" stroke-width="0.8" stroke-dasharray="2 4"/>
  <circle cx="420" cy="170" r="30" fill="none" stroke="#00f7ff" stroke-width="0.5" stroke-opacity="0.3"/>
  <line x1="420" y1="50" x2="420" y2="290" stroke="#00f7ff" stroke-width="0.4" stroke-opacity="0.15" stroke-dasharray="2 4"/>
  <line x1="160" y1="170" x2="680" y2="170" stroke="#00f7ff" stroke-width="0.4" stroke-opacity="0.15" stroke-dasharray="2 4"/>

  <!-- 半简约动态轨道线：高精密经典8字形三体周期轨迹 (带脉冲流动光点) -->
  <path d="M 420 170 C 490 80, 600 110, 560 170 C 520 230, 420 170, 420 170 C 420 170, 320 110, 280 170 C 240 230, 350 260, 420 170 Z" 
        fill="none" stroke="#00f7ff" stroke-width="1.2" stroke-opacity="0.4" stroke-dasharray="6 4">
    <animate attributeName="stroke-dashoffset" values="40;0" dur="2.4s" repeatCount="indefinite"/>
  </path>

  <path d="M 420 170 C 490 80, 600 110, 560 170 C 520 230, 420 170, 420 170 C 420 170, 320 110, 280 170 C 240 230, 350 260, 420 170 Z" 
        fill="none" stroke="#ff007f" stroke-width="0.8" stroke-opacity="0.3" stroke-dasharray="10 8">
    <animate attributeName="stroke-dashoffset" values="0;72" dur="3.6s" repeatCount="indefinite"/>
  </path>

  <!-- 恒星 α (青色天体 - 质量主体 1) -->
  <g>
    <circle cx="0" cy="0" r="16" fill="url(#sun-alpha)">
      <animate attributeName="r" values="14;19;14" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="0" cy="0" r="5.5" fill="#ffffff" stroke="#00f7ff" stroke-width="1.5"/>
    <animateMotion dur="7.2s" repeatCount="indefinite" rotate="auto">
      <mpath href="#orbit-path-alpha"/>
    </animateMotion>
  </g>

  <!-- 恒星 β (品红天体 - 质量主体 2) -->
  <g>
    <circle cx="0" cy="0" r="16" fill="url(#sun-beta)">
      <animate attributeName="r" values="18;13;18" dur="2.1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="0" cy="0" r="5.5" fill="#ffffff" stroke="#ff007f" stroke-width="1.5"/>
    <animateMotion dur="7.2s" repeatCount="indefinite" rotate="auto">
      <mpath href="#orbit-path-beta"/>
    </animateMotion>
  </g>

  <!-- 恒星 γ (荧光绿天体 - 质量主体 3) -->
  <g>
    <circle cx="0" cy="0" r="16" fill="url(#sun-gamma)">
      <animate attributeName="r" values="13;17;13" dur="1.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="0" cy="0" r="5.5" fill="#ffffff" stroke="#00ff88" stroke-width="1.5"/>
    <animateMotion dur="7.2s" repeatCount="indefinite" rotate="auto">
      <mpath href="#orbit-path-gamma"/>
    </animateMotion>
  </g>

  <!-- 质心标记 (Barycenter - 动态呼吸十字原点) -->
  <g transform="translate(420, 170)">
    <circle cx="0" cy="0" r="3" fill="#ffd700">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="0.9s" repeatCount="indefinite"/>
    </circle>
    <line x1="-8" y1="0" x2="8" y2="0" stroke="#ffd700" stroke-width="0.8" stroke-opacity="0.8"/>
    <line x1="0" y1="-8" x2="0" y2="8" stroke="#ffd700" stroke-width="0.8" stroke-opacity="0.8"/>
    <text x="12" y="4" fill="#ffd700" font-family="'Fira Code', monospace" font-size="9" font-weight="bold">BARYCENTER (CM)</text>
  </g>

  <!-- 底部半简约天体物理参数与引力遥测数值 -->
  <line x1="20" y1="298" x2="820" y2="298" stroke="#00f7ff" stroke-width="0.5" stroke-opacity="0.25"/>
  <text x="35" y="322" fill="#00f7ff" font-family="'Fira Code', 'Microsoft YaHei', monospace" font-size="11">● 恒星 α: m₁=1.00 M☉ [活跃]</text>
  <text x="240" y="322" fill="#ff007f" font-family="'Fira Code', 'Microsoft YaHei', monospace" font-size="11">● 恒星 β: m₂=1.00 M☉ [摄动中]</text>
  <text x="450" y="322" fill="#00ff88" font-family="'Fira Code', 'Microsoft YaHei', monospace" font-size="11">● 恒星 γ: m₃=1.00 M☉ [共振]</text>
  <text x="805" y="322" fill="#8b949e" font-family="'Fira Code', monospace" font-size="11" text-anchor="end">G=6.674×10⁻¹¹ N·m²/kg² | 混沌解 8-ORBIT</text>
</svg>